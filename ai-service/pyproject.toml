[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-checker-ai-service"
version = "0.1.0"
description = "课堂视频情绪推理与后端入库服务"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
fer = ["fer>=22.5"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8"]

[project.scripts]
emoji-ai = "ai_service.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
